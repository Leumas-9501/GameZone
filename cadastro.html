<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Crie sua conta GameZone e aproveite nossa loja gamer.">

        <title>Criar Conta | GameZone</title>

        <link rel="stylesheet" href="Estilos - CSS/padrão.css">
        <link rel="stylesheet" href="Estilos - CSS/cadastro.css">
    </head>
    <body>

        <!-- Conteúdo principal -->
        <main id="conteudo-principal">

            <section id="cadastro">
                <div class="container-cadastro">

                    <!-- Voltar ao início -->
                    <nav id="links-cadastro-topo" aria-label="Navegação auxiliar">
                        <a href="index.html">← Voltar ao início</a>
                    </nav>

                    <!-- Logo GameZone -->
                    <p id="marca-cadastro">
                        GAME<span>ZONE</span>
                    </p>

                    <!-- Introdução -->
                    <header id="cadastro-introducao">
                        <h1>Crie sua conta</h1>
                        <p>Entre para a comunidade GameZone e prepare-se para o próximo nível!</p>
                    </header>

                    <!-- Formulário de cadastro -->
                    <form id="form-cadastro">

                        <fieldset id="dados-pessoais">
                            <legend>Dados pessoais</legend>

                            <div class="campo-formulario">
                                <label for="cadastro-nome">Nome</label>
                                <input
                                    type="text"
                                    id="cadastro-nome"
                                    name="nome"
                                    autocomplete="given-name"
                                    placeholder="Digite seu nome"
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="cadastro-sobrenome">Sobrenome</label>
                                <input
                                    type="text"
                                    id="cadastro-sobrenome"
                                    name="sobrenome"
                                    autocomplete="family-name"
                                    placeholder="Digite seu sobrenome"
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="cadastro-cpf">CPF</label>
                                <input
                                    type="text"
                                    id="cadastro-cpf"
                                    name="cpf"
                                    autocomplete="off"
                                    inputmode="numeric"
                                    placeholder="000.000.000-00"
                                    maxlength="14"
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="cadastro-nascimento">Data de nascimento</label>
                                <input
                                    type="date"
                                    id="cadastro-nascimento"
                                    name="dataNascimento"
                                    autocomplete="bday"
                                    required
                                >
                            </div>
                        </fieldset>

                        <fieldset id="dados-acesso">
                            <legend>Dados de acesso</legend>

                            <div class="campo-formulario">
                                <label for="cadastro-email">E-mail</label>
                                <input
                                    type="email"
                                    id="cadastro-email"
                                    name="email"
                                    autocomplete="email"
                                    placeholder="seuemail@exemplo.com"
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="cadastro-senha">Senha</label>
                                <input
                                    type="password"
                                    id="cadastro-senha"
                                    name="senha"
                                    autocomplete="new-password"
                                    placeholder="Crie uma senha"
                                    minlength="6"
                                    required
                                >
                                <p>A senha deve atender aos requisitos de segurança da conta.</p>
                            </div>

                            <div class="campo-formulario">
                                <label for="cadastro-confirmar-senha">Confirmar senha</label>
                                <input
                                    type="password"
                                    id="cadastro-confirmar-senha"
                                    name="confirmarSenha"
                                    autocomplete="new-password"
                                    placeholder="Digite a senha novamente"
                                    minlength="6"
                                    required
                                >
                            </div>
                        </fieldset>

                        <!-- Termos -->
                        <div id="aceite-termos">
                            <input
                                type="checkbox"
                                id="aceitar-termos"
                                name="aceitarTermos"
                                required
                            >

                            <label for="aceitar-termos">
                                Li e aceito os
                                <a href="termos.html">termos e condições de uso</a>
                                e a
                                <a href="privacidade.html">política de privacidade</a>.
                            </label>
                        </div>

                        <!-- Mensagens do formulário -->
                        <div id="mensagens-cadastro">
                            <p id="mensagem-cadastro" role="status" aria-live="polite"></p>
                        </div>

                        <button type="submit" id="botao-cadastro">
                            Criar minha conta
                        </button>

                        <div id="separador-google">
                            <span>ou</span>
                        </div>

                        <button type="button" id="botao-google">

                            <svg
                                id="icone-google"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.31h5.23a4.47 4.47 0 0 1-1.94 2.93v2.78h3.14c1.84-1.69 2.92-4.18 2.92-7.12Z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.7c2.62 0 4.82-.87 6.43-2.36l-3.14-2.78c-.87.58-1.99.92-3.29.92-2.53 0-4.67-1.71-5.44-4.01H3.31v2.87A9.7 9.7 0 0 0 12 21.7Z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.56 13.47A5.82 5.82 0 0 1 6.25 12c0-.51.09-1 .31-1.47V7.66H3.31A9.7 9.7 0 0 0 2.3 12c0 1.56.37 3.04 1.01 4.34l3.25-2.87Z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.52c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.81 3.59 14.62 2.3 12 2.3a9.7 9.7 0 0 0-8.69 5.36l3.25 2.87C7.33 8.23 9.47 6.52 12 6.52Z"
                                />
                            </svg>

                            <span>Continuar com o Google</span>

                        </button>

                    </form>

                    <!-- Acesso para usuários existentes -->
                    <section id="acesso-existente">
                        <h2>Já possui uma conta?</h2>
                        <p>Entre com seus dados para acessar seu perfil.</p>

                        <a href="login.html" id="link-login">
                            Fazer login
                        </a>
                    </section>

                </div>
            </section>

        </main>

        <script type="module" src="JavaScript - JS/cadastro.js"></script>
    
    </body>
</html>
