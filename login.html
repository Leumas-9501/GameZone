<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Entre na sua conta GameZone para acessar seu perfil e suas compras.">

        <title>Entrar | GameZone</title>

        <link rel="stylesheet" href="Estilos - CSS/padrão.css">
        <link rel="stylesheet" href="Estilos - CSS/login.css">
    </head>
    <body>

        <main id="conteudo-principal">

            <section id="login">
                <div class="container-login">

                    <!-- Voltar ao início -->
                    <nav id="links-login" aria-label="Navegação auxiliar">
                        <a href="index.html">← Voltar ao início</a>
                    </nav>

                    <!-- Logo -->
                    <p id="marca-login">
                        GAME<span>ZONE</span>
                    </p>

                    <!-- Introdução -->
                    <header id="login-introducao">
                        <h1>Bem-vindo de volta!</h1>
                        <p>Entre na sua conta para continuar sua experiência na GameZone.</p>
                    </header>

                    <!-- Formulário de login -->
                    <form id="form-login">

                        <div class="campo-formulario">
                            <label for="login-email">E-mail</label>
                            <input
                                type="email"
                                id="login-email"
                                name="email"
                                autocomplete="email"
                                placeholder="Digite seu e-mail"
                                required
                            >
                        </div>

                        <div class="campo-formulario">
                            <label for="login-senha">Senha</label>
                            <input
                                type="password"
                                id="login-senha"
                                name="senha"
                                autocomplete="current-password"
                                placeholder="Digite sua senha"
                                required
                            >
                        </div>

                        <div class="opcoes-login">
                            <div>
                                <input
                                    type="checkbox"
                                    id="manter-conectado"
                                    name="manterConectado"
                                >
                                <label for="manter-conectado">Manter sessão iniciada</label>
                            </div>

                            <a href="recuperar-senha.html">
                                Esqueci minha senha
                            </a>
                        </div>

                        <p id="mensagem-login" role="status" aria-live="polite"></p>

                        <button type="submit" id="botao-login">
                            Entrar na conta
                        </button>

                        <div id="separador-google">
                            <span>ou</span>
                        </div>

                        <button type="button" id="google-login-btn">

                            <svg
                                id="icone-google"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.31h5.23a4.47 4.47 0 0 1-1.94 2.93v2.78h3.14c1.84-1.69 2.92-4.18 2.92-7.12Z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.7c2.62 0 4.82-.87 6.43-2.36l-3.14-2.78c-.87.58-1.99.92-3.29.92-2.53 0-4.67-1.71-5.44-4.01H3.31v2.87A9.7 9.7 0 0 0 12 21.7Z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.56 13.47A5.82 5.82 0 0 1 6.25 12c0-.51.09-1 .31-1.47V7.66H3.31A9.7 9.7 0 0 0 2.3 12c0 1.56.37 3.04 1.01 4.34l3.25-2.87Z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.52c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.81 3.59 14.62 2.3 12 2.3a9.7 9.7 0 0 0-8.69 5.36l3.25 2.87C7.33 8.23 9.47 6.52 12 6.52Z"
                                />
                            </svg>

                            <span>Continuar com o Google</span>

                        </button>

                    </form>

                    <!-- Cadastro -->
                    <section id="criar-conta">

                        <h2>Ainda não tem uma conta?</h2>
                        <p>Crie sua conta para acessar seu perfil e acompanhar seus pedidos.</p>

                        <a href="cadastro.html" id="link-cadastro">
                            Criar minha conta
                        </a>

                    </section>
                </div>
            </section>

        </main>

        <script type="module"  src="JavaScript - JS/login.js"></script>

    </body>

</html>
